plugin {
    hyprbars {
        # example config
        bar_height = 22
        bar_button_padding = 15

        bar_part_of_window = true
        bar_precedence_over_border = false
        bar_blur = true

        bar_title_enabled = true
        bar_text_font = "JetBrainsMono NF"

        bar_color = rgb(1F1A1E)

        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(ff0000), 30, 󰖭, hyprctl dispatch killactive, rgb(000000)
        hyprbars-button = rgb(eeee11), 30, 󱣴, hyprctl dispatch settiled, rgb(000000)
    }
}
