binde = $mainMod, RETURN, exec, $terminal 
bind = $mainMod, SPACE, exec, $menu

bind = $modCtrl, S, exec, hyprshot -m region -z
bind = $modCtrl ALT, S, exec, hyprshot -m window -z
bind = $modCtrl, A, exec, hyprshot -m output -z

bind = $modCtrl, Z, exec, $terminal sudo /opt/zapret/install_easy.sh
bind = $modCtrl+ALT, Z, exec, $terminal sudo /opt/zapret/uninstall_easy.sh

bind = $modCtrl, B, exec, killall waybar || hyprctl dispatch -- exec waybar -c ~/.config/waybar/Hyprland/config.jsonc -s ~/.config/waybar/Hyprland/style.css
