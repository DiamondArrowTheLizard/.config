bind = $windowResize, V, togglesplit 

bind = $windowResize, F, fullscreen
binde = $windowResize, SPACE, togglefloating

binde = $mainMod, left, movefocus, l 
binde = $mainMod, right, movefocus, r
binde = $mainMod, up, movefocus, u
binde = $mainMod, down, movefocus, d

binde = $mainMod, H, movefocus, l
binde = $mainMod, L, movefocus, r
binde = $mainMod, K, movefocus, u
binde = $mainMod, J, movefocus, d

bind = $windowMove, H, movewindoworgroup, l
bind = $windowMove, L, movewindoworgroup, r
bind = $windowMove, K, movewindoworgroup, u
bind = $windowMove, J, movewindoworgroup, d 

binde = $windowResize, H, resizeactive, -100 0
binde = $windowResize, L, resizeactive, 100 0
binde = $windowResize, K, resizeactive, 0 -100
binde = $windowResize, J, resizeactive, 0 100 

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Group control
bind = $mainMod+SHIFT, TAB, togglegroup
bind = $windowMove, TAB, changegroupactive, f
bind = $windowMove+SHIFT, TAB, changegroupactive, b

