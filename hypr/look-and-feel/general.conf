general {
    border_size = 1
    gaps_in = 3
    gaps_out = 15, 18, 25, 18
    gaps_workspaces = 15

    col.active_border = rgba(72359caa) rgba(72359cff) rgba(daaa56aa) rgba(daaa56ff) rgba(daaa5688) rgba(5f2881ff) rgba(5f288188) rgba(5f288175) 69deg
    col.inactive_border = rgba(00000000)

    no_focus_fallback = false

    resize_on_border = true
    extend_border_grab_area = 40
    hover_icon_on_border = true
    resize_corner = 0

    allow_tearing = true

    layout = dwindle

    snap {
        enabled = false
        window_gap = 10
        monitor_gap = 10
        border_overlap = false
    }
}
